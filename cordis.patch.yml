# dsh-hole bundle patch
#
# 本插件只做一件事：把 skills/hole 安装到 $DSH_HOME/skills/hole，
# 让 DSH 原生 skill-filesystem 自动发现技能（catalog 刷新后即可 skill 工具加载）。
# 不修改系统提示词、不劫持工具、不需要任何服务依赖。

- insert:
    - id: dsh-hole
      name: 'dsh-hole'
      inject: []
      config:
        registerSkill: true   # 启动时同步技能到 $DSH_HOME/skills/hole
        force: false          # true = 覆盖 $DSH_HOME 下已有的 hole（会先备份）

# ── 可选：与 dsh-purge 组合 ────────────────────────────────────────────────
# 若已安装 dsh-purge，可同时启用它的演练台（预设 + 事实库 + HTTP 桥）。
